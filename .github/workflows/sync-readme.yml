# The README is generated by alparslansemiz.com (personal-site: src/content/profile.ts and the
# project pages), so the site, the CV and this profile say the same things. Once a day this
# copies the generated file and opens a pull request when it changed. Never edit README.md here.
name: sync README
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the generated README
        run: |
          code=$(curl -sS -o README.new -w '%{http_code}' https://alparslansemiz.com/github/README.md)
          if [ "$code" != 200 ]; then echo "::notice::site returned $code, nothing to sync"; rm -f README.new; exit 0; fi
          grep -q 'Do not edit by hand' README.new || { echo "::error::not the generated README"; exit 1; }
          mv README.new README.md
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "README is up to date"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c readme-sync
          git commit -am 'Sync README from alparslansemiz.com'
          git push -f origin readme-sync
          # Opening a pull request needs "Allow GitHub Actions to create pull requests" in the repo
          # settings; without it, an issue links the branch instead.
          gh pr view readme-sync >/dev/null 2>&1 && exit 0
          if ! gh pr create --head readme-sync --title 'Sync README from alparslansemiz.com' \
            --body 'Generated from https://alparslansemiz.com/github/README.md (personal-site). Merge to update the profile.'; then
            gh issue list --state open --search 'README out of sync in:title' --json number --jq '.[0].number' | grep -q . ||
              gh issue create --title 'README out of sync with alparslansemiz.com' \
                --body "The generated README changed. Branch: https://github.com/${GITHUB_REPOSITORY}/compare/main...readme-sync"
          fi
